[project]
name = "catscan"
version = "0.1.0"
description = "Automated manuscript formatting checker for JACoW and PASJ conferences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "titlecase>=2.4.1",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks live indico integration tests (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"

