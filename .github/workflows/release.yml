name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend and plugin tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./backend pytest requests build
          (cd backend && pytest -v)
          (cd plugins/indico-plugin-catscan && PYTHONPATH=. pytest -v)

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend static assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package release archive
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          STAGE_DIR="dist/catscan-${VERSION}"
          mkdir -p "${STAGE_DIR}/backend" "${STAGE_DIR}/frontend" "${STAGE_DIR}/plugins" "${STAGE_DIR}/plugins/dist"

          cp backend/pyproject.toml backend/README.md "${STAGE_DIR}/backend/"
          cp -r backend/src "${STAGE_DIR}/backend/"
          cp -r frontend/dist "${STAGE_DIR}/frontend/"
          cp -r plugins/indico-plugin-catscan "${STAGE_DIR}/plugins/"
          rm -rf "${STAGE_DIR}/plugins/indico-plugin-catscan/tests" \
                 "${STAGE_DIR}/plugins/indico-plugin-catscan/.pytest_cache"

          python -m pip wheel --no-deps --no-build-isolation \
            -w "${STAGE_DIR}/plugins/dist" \
            plugins/indico-plugin-catscan

          printf "%s\n" "${VERSION}" > "${STAGE_DIR}/VERSION"

          ARCHIVE="dist/catscan-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" .
          (cd dist && sha256sum "catscan-${VERSION}.tar.gz" > "SHA256SUMS.txt")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/catscan-${{ steps.version.outputs.tag }}.tar.gz
            dist/SHA256SUMS.txt
